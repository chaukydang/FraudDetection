x-airflow-common: &airflow-common
  build: ./infra/airflow
  image: airflow-training:latest
  env_file:
    - ${ENV_FILE_PATH:-shared/.env}
  environment: &airflow-common-env
    # Core Configuration
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__PARALLELISM: 32
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 16
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 3

    # Database Configuration
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: 10
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: 1800
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: 20
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: 'true'

    # Celery Configuration
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CELERY__WORKER_CONCURRENCY: 16
    AIRFLOW__CELERY__BROKER_CONNECTION_RETRY_ON_STARTUP: 'true'

    # Webserver Configuration
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: 120
    AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: 1800
    AIRFLOW__WEBSERVER__WORKER_REFRESH_BATCH_SIZE: 0
    AIRFLOW__WEBSERVER__RELOAD_ON_PLUGIN_CHANGE: 'false'

    # Scheduler Configuration
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: 2
    AIRFLOW__SCHEDULER__SCHEDULER_HEARTBEAT_SEC: 5

    # Logging
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

    # External Services
    MLFLOW_TRACKING_URI: 'http://mlflow-server:5500'
    MLFLOW_S3_ENDPOINT_URL: 'http://minio:9000'

    # Python Path
    PYTHONPATH: '/opt/airflow:/opt'

    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}

  volumes:
    - ./apps/airflow/dags:/opt/airflow/dags
    - ./.local/airflow/logs:/opt/airflow/logs
    - ./apps/airflow/config:/opt/airflow/config
    - ./apps/airflow/plugins:/opt/airflow/plugins

    - ./shared/models:/opt/models
    - ./shared/config.yaml:/opt/config.yaml
    - ./shared/.env:/opt/.env
    - ./shared/trainner:/opt/trainner

  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # ============================================================================
  # DATABASE SERVICES
  # ============================================================================
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      POSTGRES_MAX_CONNECTIONS: 200
      POSTGRES_SHARED_BUFFERS: 256MB
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - fraud-detection

  redis:
    image: redis:7.2-bookworm
    container_name: redis
    expose:
      - 6379
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    networks:
      - fraud-detection

  # ============================================================================
  # AIRFLOW SERVICES
  # ============================================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    environment:
      <<: *airflow-common-env
      GUNICORN_CMD_ARGS: "--timeout 120 --workers 4 --worker-class sync --log-level info --max-requests 1000 --max-requests-jitter 50"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
      AIRFLOW__CELERY__WORKER_PREFETCH_MULTIPLIER: 1
      AIRFLOW__CELERY__WORKER_CONCURRENCY: 16
    deploy:
      mode: replicated
      replicas: 2
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-webserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          export AIRFLOW_UID=$$(id -u)
        fi
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version
        /entrypoint airflow config list >/dev/null
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    networks:
      - fraud-detection

  # ============================================================================
  # STORAGE SERVICES (MinIO + MLflow)
  # ============================================================================
  minio:
    image: minio/minio
    platform: linux/amd64
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${MINIO_USERNAME}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    volumes:
      - ./.local/minio/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - fraud-detection

  mc:
    image: minio/mc
    platform: linux/amd64
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - shared/.env
    entrypoint: >
      /bin/sh -c "
      /tmp/wait-for-it.sh minio:9000 -t 60 &&
      /usr/bin/mc alias set minio http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      /usr/bin/mc mb minio/mlflow --ignore-existing;
      exit 0;
      "
    volumes:
      - ./scripts/wait-for-it.sh:/tmp/wait-for-it.sh
    networks:
      - fraud-detection

  mlflow-server:
    build: ./infra/mlflow
    image: mlflow-server
    container_name: mlflow-server
    depends_on:
      mc:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "5500:5500"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    command: >
      mlflow server --host 0.0.0.0 --port 5500
      --backend-store-uri postgresql+psycopg2://mlflow:mlflow@postgres/mlflow
      --default-artifact-root s3://mlflow/
      --serve-artifacts
      --allowed-hosts "mlflow-server,mlflow-server:5500,localhost,localhost:5500,127.0.0.1,127.0.0.1:5500,178.128.69.202,178.128.69.202:5500"
      --cors-allowed-origins "http://localhost:5500,http://127.0.0.1:5500,http://178.128.69.202:5500"
      --uvicorn-opts "--timeout-keep-alive 120"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5500/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - fraud-detection

  # ============================================================================
  # DATA PRODUCER SERVICE
  # ============================================================================
  producer:
    build: ./apps/producer
    env_file: shared/.env
    environment:
      BATCH_MESSAGES: "400"
      BATCH_SLEEP_SEC: "0.6"
      POLL_TIMEOUT_SEC: "0.2"
      ENABLE_VALIDATE: "0"
      VALIDATE_EVERY_N: "500"
      LOG_EVERY_N: "2000"
      KAFKA_COMPRESSION: "snappy"
      KAFKA_LINGER_MS: "20"
      KAFKA_BATCH_SIZE: "65536"
      KAFKA_QUEUE_KB: "10240"
      FAST_MERCHANTS: "1"
    deploy:
      replicas: 2
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - fraud-detection

  # ============================================================================
  # SPARK CLUSTER
  # ============================================================================
  spark-master:
    build: ./infra/spark
    image: spark:3.5.1
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    command: >
      /bin/bash -lc "
      mkdir -p /opt/ivy-cache /opt/spark/work /opt/spark-checkpoints &&
      chmod -R 777 /opt/ivy-cache /opt/spark/work /opt/spark-checkpoints || true &&
      exec /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      "
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./infra/spark/conf:/opt/spark/conf:ro
      - ./.local/spark/ivy-cache:/opt/ivy-cache
      - ./.local/spark/checkpoints:/opt/spark-checkpoints
      - ./.local/spark/work/master:/opt/spark/work
      - ./apps/spark_jobs:/opt/jobs
      - ./shared/config.yaml:/opt/config.yaml
      - ./shared/trainner:/opt/trainner
      - ./shared/.env:/opt/.env
    restart: unless-stopped
    networks:
      - fraud-detection

  spark-worker-streaming:
    build: ./infra/spark
    image: spark:3.5.1
    container_name: spark-worker-streaming
    depends_on:
      spark-master:
        condition: service_started
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1536m
    command: >
      /bin/bash -lc "
      mkdir -p /opt/ivy-cache /opt/spark/work /opt/spark-checkpoints &&
      chmod -R 777 /opt/ivy-cache /opt/spark/work /opt/spark-checkpoints || true &&
      exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
      "
    ports:
      - "8082:8082"
    volumes:
      - ./infra/spark/conf:/opt/spark/conf:ro
      - ./.local/spark/ivy-cache:/opt/ivy-cache
      - ./.local/spark/checkpoints:/opt/spark-checkpoints
      - ./.local/spark/work/worker-streaming:/opt/spark/work
      - ./shared/trainner:/opt/trainner
      - ./shared/.env:/opt/.env
    restart: unless-stopped
    networks:
      - fraud-detection

  spark-worker-training:
    build: ./infra/spark
    image: spark:3.5.1
    container_name: spark-worker-training
    depends_on:
      spark-master:
        condition: service_started
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2560m
    command: >
      /bin/bash -lc "
      mkdir -p /opt/ivy-cache /opt/spark/work /opt/spark-checkpoints &&
      chmod -R 777 /opt/ivy-cache /opt/spark/work /opt/spark-checkpoints || true &&
      exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
      "
    ports:
      - "8083:8083"
    volumes:
      - ./infra/spark/conf:/opt/spark/conf:ro
      - ./.local/spark/ivy-cache:/opt/ivy-cache
      - ./.local/spark/checkpoints:/opt/spark-checkpoints
      - ./.local/spark/work/worker-training:/opt/spark/work
      - ./shared/trainner:/opt/trainner
      - ./shared/models:/opt/models
      - ./shared/.env:/opt/.env
    restart: unless-stopped
    networks:
      - fraud-detection

volumes:
  postgres-db-volume:
    driver: local

networks:
  fraud-detection:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
