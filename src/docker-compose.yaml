# docker-compose.yaml
x-airflow-common: &airflow-common
  build: ./infra/airflow
  image: airflow-training:latest
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    # FIX: do not leave Fernet key empty (stability + secrets encryption)
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__CORE__PARALLELISM: 8
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 4
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CELERY__WORKER_CONCURRENCY: 4
    AIRFLOW__CELERY__WORKER_PREFETCH_MULTIPLIER: 1

    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: 120
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: 1
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}

    MLFLOW_TRACKING_URI: "http://mlflow-server:5500"
    MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"

    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

    PYTHONPATH: "/opt/airflow:/opt"
    PATH: "/home/airflow/.local/bin:/usr/local/bin:/usr/bin:/bin"

  volumes:
    - ./apps/airflow/dags:/opt/airflow/dags
    - ./apps/airflow/logs:/opt/airflow/logs
    - ./apps/airflow/config:/opt/airflow/config
    - ./apps/airflow/plugins:/opt/airflow/plugins
    - ./shared/models:/opt/models
    - ./shared/config.yaml:/opt/config.yaml
    - ./shared/.env:/opt/.env
    - ./shared/trainner:/opt/trainner
    - ./apps/spark_jobs:/opt/jobs
    # DEV-ONLY: docker socket gives host-level control to Airflow container
    - /var/run/docker.sock:/var/run/docker.sock

  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  networks:
    - fraud-detection

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: always
    mem_limit: 1g
    cpus: 1.0
    networks:
      - fraud-detection

  redis:
    image: redis:7.2-bookworm
    container_name: redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    mem_limit: 256m
    cpus: 0.5
    networks:
      - fraud-detection

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    environment:
      <<: *airflow-common-env
      GUNICORN_CMD_ARGS: "--timeout 120 --workers 2 --worker-class sync --log-level info"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: always
    mem_limit: 1.5g
    cpus: 1.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: always
    mem_limit: 1.5g
    cpus: 1.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: celery worker
    restart: always
    mem_limit: 4g
    cpus: 2.0
    depends_on:
      airflow-webserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    restart: always
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow || true

        /entrypoint airflow version

        if [ "${AIRFLOW_DB_RESET:-false}" = "true" ]; then
          echo "AIRFLOW_DB_RESET=true -> resetting airflow metadata DB"
          /entrypoint airflow db reset -y
        else
          /entrypoint airflow db migrate
        fi

        /entrypoint airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Airflow --lastname Admin --role Admin --email admin@example.com || true
    environment:
      <<: *airflow-common-env
      _PIP_ADDITIONAL_REQUIREMENTS: ""
      AIRFLOW_DB_RESET: ${AIRFLOW_DB_RESET:-false}
    user: "0:0"
    restart: "no"
    networks:
      - fraud-detection

  minio:
    image: minio/minio
    container_name: minio
    platform: linux/arm64/v8
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./.local/minio/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    mem_limit: 1g
    cpus: 0.5
    networks:
      - fraud-detection

  mc:
    image: minio/mc
    container_name: mc
    platform: linux/arm64/v8
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      /tmp/wait-for-it.sh minio:9000 -t 60 &&
      /usr/bin/mc alias set minio http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      /usr/bin/mc mb minio/mlflow --ignore-existing &&
      /usr/bin/mc mb minio/datalake --ignore-existing;
      exit 0;
      "
    volumes:
      - ./scripts/wait-for-it.sh:/tmp/wait-for-it.sh
    restart: "no"
    networks:
      - fraud-detection

  mlflow-server:
    build: ./infra/mlflow
    image: mlflow-server
    container_name: mlflow-server
    depends_on:
      mc:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "5500:5500"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5500"
      - --backend-store-uri
      - postgresql://airflow:airflow@postgres:5432/mlflow
      - --default-artifact-root
      - s3://mlflow
      - --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5500/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    mem_limit: 1g
    cpus: 0.5
    networks:
      - fraud-detection

  producer:
    build: ./apps/producer
    container_name: producer
    env_file: .env
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    networks:
      - fraud-detection

  spark-master:
    build: ./infra/spark
    image: spark-custom:3.5.1
    container_name: spark-master
    platform: linux/arm64/v8
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8081:8080"
    environment:
      SPARK_DAEMON_MEMORY: 512m
      SPARK_WORKER_TIMEOUT: 600
      SPARK_NETWORK_TIMEOUT: 600s
      SPARK_MASTER_OPTS: "-Dspark.worker.timeout=600"

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./apps/spark_jobs:/opt/jobs
      - ./shared/trainner:/opt/trainner
      - ./shared/models:/opt/models
      - ./shared/config.yaml:/opt/config.yaml
      - ./.local/spark/checkpoints:/opt/spark-checkpoints
      - ./.local/spark/ivy_cache:/opt/ivy-cache
      - ./infra/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    networks:
      - fraud-detection

  spark-worker:
    image: spark-custom:3.5.1
    container_name: spark-worker
    platform: linux/arm64/v8
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 6g
      SPARK_DAEMON_MEMORY: 512m
      SPARK_NETWORK_TIMEOUT: 600s
      SPARK_EXECUTOR_HEARTBEAT_INTERVAL: 30s
      SPARK_WORKER_OPTS: "-Dspark.worker.timeout=600"

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./shared/models:/opt/models
      - ./shared/config.yaml:/opt/config.yaml
      - ./.local/spark/checkpoints:/opt/spark-checkpoints
      - ./.local/spark/ivy_cache:/opt/ivy-cache
      - ./infra/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    restart: unless-stopped
    mem_limit: 7g
    cpus: 3.0
    networks:
      - fraud-detection

  spark-stream-kafka-to-minio:
    image: spark-custom:3.5.1
    container_name: spark-stream-kafka-to-minio
    platform: linux/arm64/v8
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
    command:
      [
        "/opt/spark/bin/spark-submit",
        "--master", "spark://spark-master:7077",
        "--deploy-mode", "client",

        "--conf", "spark.jars.ivy=/opt/ivy-cache",

        "--conf", "spark.cores.max=1",
        "--conf", "spark.executor.instances=1",
        "--conf", "spark.executor.cores=1",
        "--conf", "spark.executor.memory=768m",
        "--conf", "spark.driver.memory=768m",
        "--conf", "spark.sql.shuffle.partitions=2",

        "--packages", "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1",
        "/opt/jobs/stream_kafka_to_minio.py",
        "--config", "/opt/config.yaml"
      ]
    volumes:
      - ./apps/spark_jobs:/opt/jobs
      - ./shared/config.yaml:/opt/config.yaml
      - ./.local/spark/checkpoints:/opt/spark-checkpoints
      - ./.local/spark/ivy_cache:/opt/ivy-cache
      - ./infra/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    restart: unless-stopped
    mem_limit: 1.5g
    cpus: 1.0
    networks:
      - fraud-detection

volumes:
  postgres-db-volume:

networks:
  fraud-detection:
    driver: bridge
